title: Theoryscope
description: A renormalisation-group workbench for corpora of theoretical texts.
theme: jekyll-theme-cayman
show_downloads: false
github:
  repository_url: https://github.com/vector-lab-tools/theoryscope
  repository_nwo: vector-lab-tools/theoryscope
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: true
include:
  - CONTRIBUTING.md
  - README.md
  - LICENSE
exclude:
  - node_modules
  - vendor
